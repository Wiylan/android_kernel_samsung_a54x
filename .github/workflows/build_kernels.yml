          git clone https://github.com/daglaroglou/a54x_kernel_patches.git

      - name: Checkout susfs4ksu
        run: |
          cd $HOME/susfs4ksu
          git checkout babf6be195576f09aae79650d47abf6a76e8a21b

      - name: Copy SUSFS files
        run: |
          cd $HOME/susfs4ksu
          cp kernel_patches/50_add_susfs_in_gki-android13-5.15.patch $HOME/kernel/
          cp kernel_patches/fs/* $HOME/kernel/fs/
          cp kernel_patches/include/linux/* $HOME/kernel/include/linux/

      - name: Copy kernel patches
        run: |
          cd $HOME/kernel
          cp $HOME/a54x_kernel_patches/susfs/* $HOME/kernel/
          cp $HOME/a54x_kernel_patches/hooks/scope_min_manual_hooks_v1.4.patch $HOME/kernel/

      - name: Apply patches
        run: |
          set +e
          cd $HOME/kernel
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch
          patch -p1 < exec.patch
          patch -p1 < namespace.patch
          patch -p1 < base.patch
          patch -p1 < scope_min_manual_hooks_v1.4.patch
          set -e

      - name: Set config variables for SUSFS
        run: |
          cd $HOME/kernel
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_TRY_UMOUNT \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --set-val CONFIG_KSU_SUSFS_SUS_SU n

      - name: Set config variables for Mountify
        run: |
          cd $HOME/kernel
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_TMPFS_XATTR \
            --enable CONFIG_TMPFS_POSIX_ACL
            
      - name: Add Baseband Guard
        run: |          
          cd $HOME/kernel
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' security/Kconfig
          cat $HOME/kernel/security/Kconfig

      - name: Set config variable for Baseband Guard
        run: |
          cd $HOME/kernel
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_BBG

      - name: Set config variable for Localversion
        run: |
          cd $HOME/kernel
          ./scripts/config --file arch/arm64/configs/custom.config \
            --set-str CONFIG_LOCALVERSION "-DΛG-WILDKSU_SUSFS" \
            --set-val CONFIG_LOCALVERSION_AUTO n

      - name: Build kernel
        run: |
          cd $HOME/kernel
          export PATH="$HOME/toolchain/clang-r450784c/bin:$PATH"
          export CONFIGS="a54x_defconfig custom.config"
          export KERNEL_DIR=$HOME/kernel
          export KBUILD_BUILD_HOST="GithubActions"
          export KBUILD_BUILD_USER="daglaroglou"
          export PLATFORM_VERSION=14
          export TARGET_SOC=s5e8835
          export DEPMOD=depmod
          MAKE_PARAMS="-j$(nproc --all) ARCH=arm64 KBUILD_OUTPUT=$HOME/kernel/out CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=llvm- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $MAKE_PARAMS $CONFIGS
          make $MAKE_PARAMS

      - name: Extract version info
        run: |
          cd $HOME/kernel
          LOCALVERSION=$(grep "CONFIG_LOCALVERSION=" arch/arm64/configs/custom.config | cut -d'=' -f2 | tr -d '"')
          echo "LOCALVERSION=$LOCALVERSION" >> $GITHUB_ENV
          KERNEL_NAME_RAW="${LOCALVERSION#-}"
          KERNEL_NAME_RELEASE="${KERNEL_NAME_RAW//Λ/A}"
          echo "KERNEL_NAME=$KERNEL_NAME_RELEASE" >> $GITHUB_ENV

      - name: Verify kernel build
        run: |
          if [ ! -f "$HOME/kernel/out/arch/arm64/boot/Image" ]; then
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          echo "Kernel build successful!"

      - name: Create zip
        run: |
          cd $HOME/AnyKernel3
          cp $HOME/kernel/out/arch/arm64/boot/Image $HOME/AnyKernel3/
          7z a "${{ env.KERNEL_NAME }}.zip" . -xr!*.git*

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: /home/runner/AnyKernel3/*.zip
          name: DΛG Kernels - ${{ env.DATE }}
          tag_name: "${{ env.DATE }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build_dag, build_permissive, build_ksu, build_ksun, build_sukisu, build_wildksu, build_ksu_susfs, build_ksun_susfs, build_sukisu_susfs, build_wildksu_susfs]
    if: always()
    
    steps:
      - name: Set date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Send Telegram Summary Notification
        run: |
          # Build status summary
          TOTAL=0
          SUCCESS=0
          FAILED=0
          SKIPPED=0
          
          VARIANTS=("DΛG:${{ needs.build_dag.result }}" "Permissive:${{ needs.build_permissive.result }}" "KSU:${{ needs.build_ksu.result }}" "KSUN:${{ needs.build_ksun.result }}" "SukiSU:${{ needs.build_sukisu.result }}" "WildKSU:${{ needs.build_wildksu.result }}" "KSU-SUSFS:${{ needs.build_ksu_susfs.result }}" "KSUN-SUSFS:${{ needs.build_ksun_susfs.result }}" "SukiSU-SUSFS:${{ needs.build_sukisu_susfs.result }}" "WildKSU-SUSFS:${{ needs.build_wildksu_susfs.result }}")
          
          STATUS_DETAILS=""
          for variant in "${VARIANTS[@]}"; do
            NAME="${variant%%:*}"
            RESULT="${variant##*:}"
            
            if [ "$RESULT" == "success" ]; then
              STATUS_DETAILS="${STATUS_DETAILS}✅ ${NAME}\n"
              ((SUCCESS++))
              ((TOTAL++))
            elif [ "$RESULT" == "failure" ]; then
              STATUS_DETAILS="${STATUS_DETAILS}❌ ${NAME}\n"
              ((FAILED++))
              ((TOTAL++))
            elif [ "$RESULT" == "skipped" ]; then
              STATUS_DETAILS="${STATUS_DETAILS}⏭️ ${NAME}\n"
              ((SKIPPED++))
            fi
          done
          
          # Overall status
          if [ $FAILED -eq 0 ] && [ $SUCCESS -gt 0 ]; then
            OVERALL_EMOJI="✅"
            OVERALL_STATUS="All Builds Successful"
          elif [ $SUCCESS -gt 0 ] && [ $FAILED -gt 0 ]; then
            OVERALL_EMOJI="⚠️"
            OVERALL_STATUS="Partial Success"
          elif [ $FAILED -gt 0 ]; then
            OVERALL_EMOJI="❌"
            OVERALL_STATUS="Build Failed"
          else
            OVERALL_EMOJI="⏭️"
            OVERALL_STATUS="All Builds Skipped"
          fi
          
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}" \
            -F text="
          ${OVERALL_EMOJI} *DΛG Kernels Build Completed!*
          
          📦 *Repository:* [${{ github.repository }}](https://github.com/${{ github.repository }})
          ⚙️ *Version:* 5.15.180
          🔧 *Clang:* r450784c
          📅 *Date:* ${DATE}
          
          📊 *Build Summary:*
          • Total: ${TOTAL}
          • Success: ${SUCCESS}
          • Failed: ${FAILED}
          • Skipped: ${SKIPPED}
          
          📋 *Build Results:*
          ${STATUS_DETAILS}
          💾 *Download releases:* [GitHub Releases](https://github.com/${{ github.repository }}/releases)
          [🔗 View GitHub Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            -F parse_mode="Markdown"
