name: Build Kernels

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Kernel variant to build'
        required: true
        default: 'All variants'
        type: choice
        options:
          - All variants
          - DΛG
          - Permissive
          - KSU
          - KSUN
          - SukiSU
          - WildKSU
          - KSU-SUSFS
          - KSUN-SUSFS
          - SukiSU-SUSFS
          - WildKSU-SUSFS

jobs:
  notify-start:
    name: Send Start Notification
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v4
        with:
          ref: 'DΛG'

      - name: Send Telegram Start Notification
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}" \
            -F text="*New DΛG Kernel Build Started!*
            🔗 [View GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            -F parse_mode="Markdown" \
            -F disable_web_page_preview=true

  build_dag:
    name: Build DΛG Kernel
    needs: [notify-start]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.variant == 'All variants' || github.event.inputs.variant == 'DΛG' }}
    
    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v4
        with:
          ref: 'DΛG'

      - name: Read CHANGELOG.md
        id: changelog
        run: |
          CHANGELOG=$(cat CHANGELOG.md)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download Apache Arrow's util_free_space.sh
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils \
          default-jdk git gnupg flex bison gperf build-essential zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev \
          python3 make sudo gcc g++ bc grep tofrodos python3-markdown libxml2-utils xsltproc zlib1g-dev python-is-python3 libc6-dev libtinfo6 \
          make repo cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools zstd rsync --fix-missing && \
          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && \
          sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb && \
          rm libtinfo5_6.3-2ubuntu0.1_amd64.deb
      
      - name: Make directories
        run: |
          mkdir -p $HOME/kernel
          mkdir -p $HOME/toolchain
          mkdir -p $HOME/toolchain/clang-r450784c

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: $HOME/toolchain/clang-r450784c
          key: clang-r450784c-toolchain

      - name: Fetch toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          wget -c https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r450784/clang-r450784c.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/toolchain/clang-r450784c && rm -rf clang.tar.gz
        
      - name: Fetch AnyKernel3
        run: |
          git clone --branch a54x https://github.com/daglaroglou/AnyKernel3.git $HOME/AnyKernel3

      - name: Fetch kernel source
        run: |
          git clone https://github.com/daglaroglou/android_kernel_samsung_a54x $HOME/kernel

      - name: Login actions bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set date
        id: date
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set start time
        id: start_time
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Fetch kernel manager versions
        id: versions
        run: |
          KSU_VERSION=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "KernelSU version: $KSU_VERSION"
          
          KSUN_VERSION=$(curl -s https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "KSUN_VERSION=$KSUN_VERSION" >> $GITHUB_ENV
          echo "KernelSU-Next version: $KSUN_VERSION"
          
          SUKISU_VERSION=$(curl -s https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "SUKISU_VERSION=$SUKISU_VERSION" >> $GITHUB_ENV
          echo "SukiSU Ultra version: $SUKISU_VERSION"
          
          WILDKSU_VERSION=$(curl -s https://api.github.com/repos/WildKernels/Wild_KSU/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "WILDKSU_VERSION=$WILDKSU_VERSION" >> $GITHUB_ENV
          echo "WildKSU version: $WILDKSU_VERSION"

      - name: Set config variables for Mountify
        run: |
          cd $HOME/kernel
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_TMPFS_XATTR \
            --enable CONFIG_TMPFS_POSIX_ACL

      - name: Set config variable for Localversion
        run: |
          cd $HOME/kernel
          ./scripts/config --file arch/arm64/configs/custom.config \
            --set-str CONFIG_LOCALVERSION "-DΛG" \
            --set-val CONFIG_LOCALVERSION_AUTO n

      - name: Build kernel
        run: |
          cd $HOME/kernel
          export PATH="$HOME/toolchain/clang-r450784c/bin:$PATH"
          export CONFIGS="a54x_defconfig custom.config"
          export KERNEL_DIR=$HOME/kernel
          export KBUILD_BUILD_HOST="Github-Actions"
          export KBUILD_BUILD_USER="daglaroglou"
          export PLATFORM_VERSION=16
          export TARGET_SOC=s5e8835
          export DEPMOD=depmod
          MAKE_PARAMS="-j$(nproc --all) ARCH=arm64 KBUILD_OUTPUT=$HOME/kernel/out CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=llvm- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $MAKE_PARAMS $CONFIGS
          make $MAKE_PARAMS

      - name: Extract version info
        id: version_info
        run: |
          cd $HOME/kernel
          LOCALVERSION=$(grep "CONFIG_LOCALVERSION=" arch/arm64/configs/custom.config | cut -d'=' -f2 | tr -d '"')
          echo "LOCALVERSION=$LOCALVERSION" >> $GITHUB_ENV
          KERNEL_NAME_RAW="${LOCALVERSION#-}"
          KERNEL_NAME_RELEASE="${KERNEL_NAME_RAW//Λ/A}"
          echo "KERNEL_NAME=$KERNEL_NAME_RELEASE" >> $GITHUB_ENV
          echo "Extracted kernel name: $KERNEL_NAME_RELEASE"

      - name: Verify kernel build
        run: |
          if [ ! -f "$HOME/kernel/out/arch/arm64/boot/Image" ]; then
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          echo "Kernel build successful!"
          ls -la $HOME/kernel/out/arch/arm64/boot/Image

      - name: Create zip
        run: |
          cd $HOME/AnyKernel3
          cp $HOME/kernel/out/arch/arm64/boot/Image $HOME/AnyKernel3/
          7z a "${{ env.KERNEL_NAME }}.zip" . -xr!*.git*

      - name: Calculate elapsed time
        id: elapsed_time
        run: |
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          MINUTES=$((ELAPSED / 60))
          SECONDS=$((ELAPSED % 60))
          ELAPSED_TIME="${MINUTES}m ${SECONDS}s"
          echo "ELAPSED_TIME=$ELAPSED_TIME" >> $GITHUB_OUTPUT 

      - name: Publish to GitHub
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: /home/runner/AnyKernel3/*.zip
          name: DΛG Kernels - ${{ env.DATE }}
          tag_name: "${{ env.DATE }}"
          body: |
            ### Changelog
            ${{ steps.changelog.outputs.changelog }}

            ### Kernel managers
            - **KernelSU:** https://github.com/tiann/KernelSU
            - **KernelSU-Next:** https://github.com/KernelSU-Next/KernelSU-Next
            - **SukiSU Ultra:** https://github.com/SukiSU-Ultra/SukiSU-Ultra
            - **WildKSU:** https://github.com/WildKernels/Wild_KSU

            ### SUSFS Module
            - **SUSFS:** https://github.com/sidex15/susfs4ksu-module (Optional for SukiSU Ultra)

            ### Build Information
            - **Kernel Version:** 5.15.180  
            - **Clang Version:** r450784c
            - **KernelSU Version:** ${{ env.KSU_VERSION }}
            - **KernelSU-Next Version:** ${{ env.KSUN_VERSION }}
            - **SukiSU Ultra Version:** ${{ env.SUKISU_VERSION }}
            - **WildKSU Version:** ${{ env.WILDKSU_VERSION }}
            - **SUSFS Version:** 2.0.0 (1.5.12 for WildKSU)
            - **Build Time:** ${{ steps.elapsed_time.outputs.ELAPSED_TIME }}
            ---
            <div align="center">
            力を解き放つ
            </div>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_permissive:
